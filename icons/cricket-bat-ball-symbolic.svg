<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Symbolic bat + ball for the GNOME panel -->
  <g fill="#bebebe">
    <!-- Bat blade -->
    <path d="M3.2 13.4c-.4.4-1.1.4-1.5 0-.4-.4-.4-1.1 0-1.5L9.8 3.8c.5-.5 1.3-.5 1.8 0l1.6 1.6c.5.5.5 1.3 0 1.8L3.2 13.4z"/>
    <!-- Bat handle grip -->
    <rect x="11.2" y="1.2" width="2.2" height="3.6" rx="0.7" transform="rotate(45 12.3 3)"/>
    <!-- Ball -->
    <circle cx="4.2" cy="4.4" r="2.1"/>
  </g>
  <!-- Ball seam (cutout look via darker stroke on symbolic) -->
  <path d="M3.1 3.5c.5.4 1.2.7 1.9.7.4 0 .8-.1 1.1-.2" fill="none" stroke="#7f7f7f" stroke-width="0.6" stroke-linecap="round"/>
</svg>
